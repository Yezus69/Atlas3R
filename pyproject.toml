[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas3r"
version = "0.1.0"
description = "Real-time RGB neural metric mapping toolkit."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Atlas3R contributors" }]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]
train = [
  "torch",
  "Pillow",
]

[project.scripts]
atlas3r = "atlas3r.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["atlas3r"]
