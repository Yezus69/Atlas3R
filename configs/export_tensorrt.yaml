# NVIDIA production export profile.

export:
  target: tensorrt
  input_shape: [1, 3, 384, 512]
  dynamic_shapes: false
  precision: fp16
  allow_tf32: true
  enable_int8: false
  calibration_cache: artifacts/int8_calibration.cache
  max_workspace_gb: 8
  opset: 18
  onnx_path: artifacts/smgt_s.onnx
  engine_path: artifacts/smgt_s_fp16.engine
  verify:
    compare_to_pytorch: true
    max_depth_abs_diff_m: 0.02
    max_pose_translation_diff_m: 0.005
    max_pose_rotation_diff_deg: 0.1
    min_speedup_vs_pytorch: 1.3
