# Atlas3R default training config for Streaming Metric Geometry Transformer (SMGT).
# This is a blueprint config. Codex should keep every field explicit and versioned.

experiment:
  name: smgt_b_streaming_metric_v0
  seed: 1337
  output_dir: runs/smgt_b_streaming_metric_v0
  precision: bf16-mixed
  log_every_steps: 20
  validate_every_steps: 1000
  checkpoint_every_steps: 2000
  max_steps: 300000

hardware:
  accelerator: cuda
  devices: 2
  strategy: ddp
  compile: false
  gradient_checkpointing: true
  dataloader_workers_per_gpu: 8
  prefetch_factor: 2

model:
  name: smgt_b
  image_size: [384, 512]
  patch_size: 16
  encoder:
    family: dinov3_or_convnext
    init: teacher_or_imagenet
    frozen_steps: 10000
    output_strides: [4, 8, 16, 32]
  dimensions:
    token_dim: 768
    memory_dim: 512
    num_layers: 12
    num_heads: 12
    mlp_ratio: 4
  memory:
    anchor_keyframes: 8
    local_keyframes: 16
    trajectory_tokens_per_keyframe: 8
    max_trajectory_keyframes: 256
    loop_keyframes: 4
    detach_old_memory: true
  heads:
    depth: true
    normals: true
    pointmaps: true
    pose: true
    intrinsics: true
    dense_matches: true
    objects: true
    dynamic: true
    uncertainty: true

data:
  schema_version: 1
  global_image_size: [384, 512]
  sequence:
    min_len: 2
    max_len: 64
    schedule:
      - {until_step: 20000, len: 2}
      - {until_step: 80000, len: 8}
      - {until_step: 150000, len: 16}
      - {until_step: 230000, len: 32}
      - {until_step: 300000, len: 64}
  mix:
    synthetic_cube_rooms: 0.10
    scannetpp: 0.18
    arkitscenes: 0.18
    hypersim: 0.12
    tartanair: 0.12
    replica_hm3d_rendered: 0.12
    real_video_teacher_cache: 0.18
  teacher_cache_root: /data/atlas3r/teacher_cache
  metric_only_for_absolute_scale: true

optimizer:
  type: adamw
  lr: 0.0002
  weight_decay: 0.05
  betas: [0.9, 0.95]
  grad_clip_norm: 1.0
  accumulate_grad_batches: 4
  scheduler:
    type: cosine_with_warmup
    warmup_steps: 10000
    min_lr_ratio: 0.05

loss_weights:
  depth: 1.0
  normal: 0.2
  pointmap: 1.0
  pose: 0.5
  intrinsics: 0.1
  matching: 0.2
  multiview: 0.5
  map: 0.2
  object: 0.5
  dynamic: 0.2
  uncertainty: 0.05
  distillation: 0.5
  regularization: 0.01

loss_options:
  robust: charbonnier
  charbonnier_eps: 0.001
  silog_lambda: 0.85
  photometric_weight_ssim: 0.15
  pose_translation_normalize_by_scene_scale: true
  unmetric_sequences_use_sim3_alignment: true
  mask_dynamic_for_static_losses: true
  mask_sky_reflective_transparent_if_labeled: true
  uncertainty:
    use_nll: true
    min_log_sigma: -7.0
    max_log_sigma: 3.0
  map_loss:
    enabled_after_step: 80000
    clip_len: 8
    voxel_size_m: 0.02
    truncation_m: 0.08

validation:
  datasets: [synthetic_cube_rooms, scannetpp_val, arkitscenes_val, tartanair_val]
  metrics:
    - abs_rel_depth
    - rmse_depth_m
    - normal_mae_deg
    - ate_rmse_m
    - rpe_trans_m
    - rpe_rot_deg
    - fscore_mesh_1cm
    - fscore_mesh_5cm
    - ece_confidence
    - runtime_fps_smoke
