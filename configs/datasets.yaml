# Dataset registry blueprint. Paths are examples; Codex must make adapters fail clearly when data is missing.

datasets:
  synthetic_cube_rooms:
    type: synthetic
    path: data/synthetic_cube_rooms
    has_metric_scale: true
    has_depth: true
    has_pose: true
    has_instances: true
    license_check_required: false

  scannetpp:
    type: scannetpp
    path: /data/datasets/scannetpp
    has_metric_scale: true
    has_depth: true
    has_pose: true
    has_mesh: true
    has_instances: true
    preferred_for: [high_fidelity_indoor_geometry, metric_validation]

  arkitscenes:
    type: arkitscenes
    path: /data/datasets/arkitscenes
    has_metric_scale: true
    has_rgbd: true
    has_pose: true
    has_mesh: true
    has_3d_boxes: true
    preferred_for: [mobile_camera_distribution, apple_lidar_scale]

  hypersim:
    type: hypersim
    path: /data/datasets/hypersim
    has_metric_scale: true
    has_depth: true
    has_pose: true
    has_semantics: true
    synthetic: true
    preferred_for: [exact_rendered_geometry, normals, semantics]

  tartanair:
    type: tartanair_v2
    path: /data/datasets/tartanair_v2
    has_metric_scale: true
    has_depth: true
    has_pose: true
    has_segmentation: true
    synthetic: true
    preferred_for: [large_motion, outdoor, adverse_conditions]

  replica_hm3d_rendered:
    type: habitat_rendered
    path: /data/datasets/hm3d_replica_rendered
    has_metric_scale: true
    has_depth: true
    has_pose: true
    has_mesh: true
    synthetic_rendered_from_scans: true
    preferred_for: [scene_scale_diversity, exact_mesh]

teacher_caches:
  root: /data/atlas3r/teacher_cache
  formats: [zarr, safetensors, npz]
  required_metadata:
    - teacher_name
    - teacher_version_or_commit
    - checkpoint_hash
    - input_resolution
    - scale_policy
    - coordinate_system
    - source_dataset
    - license_note
