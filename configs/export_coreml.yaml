# Apple Silicon production export profile.

export:
  target: coreml
  model_variant: smgt_s_or_tiny
  input_shape: [1, 3, 336, 448]
  precision: fp16
  compute_units: cpu_gpu_neuralengine
  flexible_shapes: false
  avoid_ops:
    - custom_cuda
    - unsupported_dynamic_attention
    - nonstatic_loop_constructs
  package_path: artifacts/Atlas3RSMGT.mlpackage
  verify:
    compare_to_pytorch_mps: true
    max_depth_abs_diff_m: 0.03
    max_pose_translation_diff_m: 0.01
    max_pose_rotation_diff_deg: 0.2
    profile_on_device_required: true
