# Runtime config for Atlas3R real-time mapping.

runtime:
  target_fps: 30
  input_size: [384, 512]
  pose_every_frame: true
  geometry_every_n_frames: 1
  object_every_n_frames: 3
  loop_closure_every_n_keyframes: 10
  max_latency_ms_pose_p90: 25
  max_latency_ms_mesh_p90: 250

model:
  variant: smgt_s
  checkpoint: checkpoints/smgt_s_best.ckpt
  precision: fp16
  backend_priority: [tensorrt, torch_compile, torch_eager, coreml, mps]
  fixed_shape: true
  input_color_space: srgb
  output_depth_resolution: [384, 512]
  output_object_resolution: [192, 256]

camera:
  intrinsics_source: metadata_or_predict
  distortion_correction: auto_if_known
  rolling_shutter_correction: estimate_if_unknown
  metric_scale_policy: confidence_weighted
  world_frame_policy: first_reliable_keyframe

keyframes:
  translation_baseline_ratio: 0.08
  rotation_deg: 8.0
  min_time_between_keyframes_ms: 150
  max_local_keyframes: 16
  max_anchor_keyframes: 8
  uncertainty_trigger: 0.35

pose_graph:
  local_window_keyframes: 16
  global_opt_enabled: true
  robust_loss: huber
  loop_closure_min_retrieval_score: 0.75
  loop_closure_min_inliers: 128
  update_mesh_chunk_transforms_after_opt: true

mapping:
  mode: adaptive_tsdf
  default_voxel_size_m: 0.01
  high_res_voxel_size_m: 0.002
  large_scene_voxel_size_m: 0.05
  truncation_voxels: 4
  max_active_blocks: 250000
  integrate_only_static: true
  min_depth_confidence: 0.35
  min_pose_confidence: 0.40
  dirty_block_mesh_interval_ms: 100
  export_chunk_size_m: 1.0

objects:
  enabled: true
  min_frames_to_confirm: 3
  fuse_object_probabilities: true
  dynamic_object_tsdf: true
  unobserved_completion_enabled: false
  open_vocab_enabled: false

outputs:
  live_api: true
  record_session: true
  session_dir: sessions/latest
  mesh_formats: [glb, ply]
  emit_pose_updates: true
  emit_mesh_chunks: true
  emit_uncertainty_maps: true
  coordinate_system: right_handed_y_up
